<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Backup Developer</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f5f5f5;
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      button {
        padding: 10px 18px;
        font-size: 1rem;
        border-radius: 6px;
        border: 1px solid #007aff;
        background-color: #007aff;
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: progress;
      }

      .status {
        margin-top: 16px;
        padding: 12px;
        border-radius: 6px;
        background: #fff;
        border: 1px solid #dcdcdc;
      }

      .status[data-state='success'] {
        border-color: #34c759;
      }

      .status[data-state='error'] {
        border-color: #ff3b30;
      }

      .progress-wrapper {
        margin-top: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .progress-track {
        position: relative;
        flex: 1;
        height: 12px;
        border-radius: 6px;
        background: #dcdcdc;
        overflow: hidden;
      }

      .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 0%;
        background: #007aff;
        transition: width 0.2s ease-out;
      }

      .progress-value {
        min-width: 40px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      ul {
        margin-top: 16px;
        padding-left: 20px;
        max-height: 300px;
        overflow-y: auto;
        background: #fff;
        border: 1px solid #dcdcdc;
        border-radius: 6px;
        padding: 12px 12px 12px 32px;
      }
    </style>
  </head>
  <body>
    <h1>Backup Developer</h1>
    <p>Clique no botão para gerar o backup da pasta /Users/thiago/Developer.</p>
    <div style="display: flex; gap: 12px;">
      <button id="backup-button">Executar backup agora</button>
      <button id="pause-button" style="display: none; background-color: #ff9500; border-color: #ff9500;">Pausar</button>
      <button id="cancel-button" style="display: none; background-color: #ff3b30; border-color: #ff3b30;">Cancelar</button>
    </div>
    <div class="status" id="status" data-state="idle">Aguardando ação.</div>
    <div class="progress-wrapper">
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <span class="progress-value" id="progress-value">0%</span>
    </div>
    <ul id="progress"></ul>
    <script src="./renderer.js"></script>
  </body>
</html>
